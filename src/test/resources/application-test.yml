spring:
  docker:
    compose:
      enabled: false
  datasource:
    url: jdbc:h2:mem:users_test;MODE=PostgreSQL;DATABASE_TO_UPPER=false;DB_CLOSE_DELAY=-1
    username: sa
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  flyway:
    enabled: true
    locations: "classpath:db/migration/{vendor}"
    baseline-on-migrate: true
logging:
  level:
    root: WARN
    it.isgroup.identity: DEBUG