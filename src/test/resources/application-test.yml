spring:
  docker:
    compose:
      enabled: false
  datasource:
    url: jdbc:h2:mem:users_test;MODE=PostgreSQL;DATABASE_TO_UPPER=false;DB_CLOSE_DELAY=-1
    username: sa
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  flyway:
    enabled: false
logging:
  level:
    root: WARN
    it.isgroup.identity: DEBUG