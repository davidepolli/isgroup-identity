services:
  postgres:
    image: postgres:16
    container_name: pg16-app
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${APP_USER}
      POSTGRES_PASSWORD: ${APP_PASSWORD}
      POSTGRES_DB: ${APP_DB}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  pgdata:
